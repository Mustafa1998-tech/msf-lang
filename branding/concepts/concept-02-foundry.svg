<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="msfFoundryTitle msfFoundryDesc">
  <title id="msfFoundryTitle">MSF Lang — Foundry concept</title>
  <desc id="msfFoundryDesc">A bold M monogram in a deep navy module, with a cyan S-shaped circuit trace and execution node.</desc>
  <defs>
    <linearGradient id="msfFoundryBadge" x1="24" y1="20" x2="232" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1740"/>
      <stop offset="0.55" stop-color="#171334"/>
      <stop offset="1" stop-color="#241A52"/>
    </linearGradient>
    <linearGradient id="msfFoundryM" x1="88" y1="64" x2="176" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEE7FF"/>
    </linearGradient>
  </defs>

  <!-- Module plate -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#msfFoundryBadge)"/>
  <rect x="17.5" y="17.5" width="221" height="221" rx="50.5" fill="none" stroke="#8B35F5" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- Structural M -->
  <path d="M 64 184
           L 64 72
           L 92 72
           L 128 128
           L 164 72
           L 192 72
           L 192 184
           L 164 184
           L 164 116
           L 128 172
           L 92 116
           L 92 184
           Z"
        fill="url(#msfFoundryM)"/>

  <!-- S-shaped execution trace, contained inside the right leg -->
  <path d="M 170 108 C 161 129 179 146 170 166"
        fill="none" stroke="#00D4FF" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="170" cy="166" r="7" fill="#00D4FF"/>
</svg>
