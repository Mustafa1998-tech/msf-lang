<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="msfAuroraTitle msfAuroraDesc">
  <title id="msfAuroraTitle">MSF Lang — Aurora concept</title>
  <desc id="msfAuroraDesc">A continuous M-shaped ribbon whose right leg flows into an S-curve and lands on a cyan execution node.</desc>
  <defs>
    <linearGradient id="msfAuroraStroke" x1="36" y1="54" x2="218" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.52" stop-color="#8B35F5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- One continuous stroke: three peaks form the M; the right leg carries an S-wave to the baseline. -->
  <path d="M 44 196
           L 44 64
           L 94 146
           L 128 90
           L 162 146
           L 214 64
           L 214 118
           C 214 144 190 146 178 162
           C 166 178 184 196 204 196"
        fill="none"
        stroke="url(#msfAuroraStroke)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Execution node: the point where the flow lands. -->
  <circle cx="204" cy="196" r="13" fill="#00D4FF"/>
</svg>
